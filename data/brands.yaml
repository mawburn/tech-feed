# Brand icons for links and incident providers.
#
# Each entry: name (display), hosts (domain suffixes; the longest matching suffix wins, so
# qwenlm.github.io beats github.io), optional icon (a Simple Icons slug: the file
# node_modules/simple-icons/icons/<slug>.svg, mounted at assets/brand-icons/), optional color
# (only for brand colours that stay readable on the dark surfaces; otherwise the icon uses the
# surrounding text colour), optional aliases (incident provider names that should match),
# optional kind (news | gov) used for the fallback icon when there is no brand logo.
#
# Brands Simple Icons does not carry (Microsoft, AWS, OpenAI, most newspapers) are listed
# without an icon so they still get the right fallback. Unlisted hosts get a globe.

# --- code hosting & developer platforms
github: { name: GitHub, icon: github, hosts: [github.com, github.blog, githubassets.com, githubusercontent.com, githubstatus.com] }
githubpages: { name: GitHub Pages, icon: github, hosts: [github.io] }  # the githubpages logo is a wordmark, unreadable at 14px
