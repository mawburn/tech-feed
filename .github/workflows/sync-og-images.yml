name: Enrich and publish

# The publishing pipeline for new and updated publications:
#   1. The ChatGPT scheduler commits data/daily/*.json or data/weekly/*.json to main.
#   2. This workflow prefetches discussion threads and stores optimized publisher images,
#      committing changes (JSON references, assets/img/*, scripts/image_manifest.json) back to main when there are any.
#   3. It then calls deploy-pages.yml to build and deploy. Pushes made with GITHUB_TOKEN do
#      not trigger other workflows, so the deploy is invoked directly via workflow_call.
#
# Enrichment steps never block publishing: if they fail, the text-only briefing still deploys.
on:
  push:
    branches: [main]
    paths:
      - "data/daily/**"
      - "data/weekly/**"
  schedule:
    - cron: "17 3 * * *" # evening Pacific refresh: discussions posted after the morning briefing
  workflow_dispatch:
    inputs:
      backfill:
        description: "Process images for every daily and weekly file (restartable; run again to continue)"
        type: boolean
        default: false
      max_images:
        description: "Maximum image downloads in this run"
        type: string
        default: "150"
      days:
        description: "Recent Pacific days to process when not backfilling"
        type: string
        default: "7"

permissions:
  contents: read

concurrency:
  group: enrich-main
  cancel-in-progress: false

jobs:
  enrich:
    # Image downloads and commits only ever happen against main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test enrichment code
        run: |
          python scripts/enrich_discussions.py --self-test
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Prefetch Hacker News and authorized Reddit discussion threads
        if: ${{ !inputs.backfill }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python scripts/enrich_discussions.py --days 2

      - name: Discover and store publisher images
        continue-on-error: true
        timeout-minutes: 25
        env:
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          MAX_IMAGES: ${{ inputs.max_images || '60' }}
          DAYS: ${{ inputs.days || '7' }}
        run: python scripts/sync_publisher_images.py ${BACKFILL} --days "${DAYS}" --max-images "${MAX_IMAGES}"

      # Enrichment must never turn a valid publication into an invalid one. Any changed
      # file that fails validation is restored to its committed version before committing.
      - name: Validate enriched files
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- 'data/daily/*.json' 'data/weekly/*.json')
          for file in "${changed[@]}"; do
            if ! node scripts/validate-content.mjs "${file}"; then
              echo "::warning file=${file}::Enrichment produced an invalid file; discarding its changes."
              git checkout -- "${file}"
            fi
          done

      - name: Commit and push enrichment
        id: commit
        run: |
          set -euo pipefail
          git add data/daily data/weekly assets/img scripts/image_manifest.json
          if git diff --cached --quiet; then
            echo "No new discussions or images."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enrich publications with discussion threads and publisher images"
          # The scheduler may publish while enrichment runs: rebase and retry, never force-push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::warning::Rebase conflict with a concurrent publication; the next run will redo this enrichment."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push enrichment after 3 attempts."
          exit 1

  deploy:
    needs: enrich
    # Deploy every new publication (even if enrichment failed) and any run that changed data.
    # A scheduled run that found nothing new does not redeploy.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (
        needs.enrich.outputs.changed == 'true' ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
