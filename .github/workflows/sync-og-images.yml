name: Sync publisher Open Graph images

on:
  push:
    branches: [main]
    paths:
      - "data/daily/**"
      - "scripts/sync_publisher_images.py"
      - "scripts/enrich_discussions.py"
      - ".github/workflows/sync-og-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher-images-main
  cancel-in-progress: false

jobs:
  sync-og-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current feed
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify discussion matcher behavior
        run: python scripts/enrich_discussions.py --self-test

      - name: Find matching Hacker News and Reddit discussions
        run: python scripts/enrich_discussions.py

      - name: Retrieve Open Graph images from original sources
        run: python scripts/sync_publisher_images.py

      - name: Validate updated feed
        run: node scripts/validate-feed.mjs

      - name: Publish image URLs to GitHub Pages feed
        shell: bash
        run: |
          if git diff --quiet -- data/daily/; then
            echo "No new verified publisher images or discussions found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          git commit -m "Enrich stories with verified community threads and publisher images"
          # Scheduled briefings may publish while metadata is being fetched.
          # Rebase a metadata-only commit safely rather than force-pushing.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
