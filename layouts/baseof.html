<!doctype html>
<html lang="en">
<head>
  {{- partial "head/meta.html" . }}
  {{- partial "head/assets.html" . }}
  {{- partial "head/schema.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "components/site-header.html" . }}
  <main id="main" class="site-main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{ partial "components/site-footer.html" . }}
</body>
</html>
